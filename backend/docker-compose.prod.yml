networks:
  tesis-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  backups:
  auth-profile-db-data:
  content-db-data:
  progress-db-data:
  classroom-db-data:
  assessment-db-data:
  advisor-db-data:
  duels-db-data:
  redis-data:

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-jvm-opts: &jvm-opts
  JAVA_TOOL_OPTIONS: >
    -XX:+UseContainerSupport
    -XX:MaxRAMPercentage=70
    -XX:InitialRAMPercentage=30
    -XX:+AlwaysActAsServerClassMachine
    -XX:+TieredCompilation
    -XX:+ExitOnOutOfMemoryError
    -Duser.timezone=America/Lima

services:
  # === Reverse proxy TLS (único expuesto) ===
  caddy:
    image: caddy:2.8
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ops/caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [tesis-network]
    restart: unless-stopped
    logging: *default-logging

  # === Frontend (interno; Caddy lo publica) ===
  frontend:
    image: ghcr.io/jair25x/tesis-frontend:${FRONTEND_TAG}
    container_name: frontend
    ports: []
    networks: [tesis-network]
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -sSf http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: "0.50", memory: "256M" }

  # === Gateway (interno; Caddy lo publica en api.*) ===
  gateway-service:
    image: ghcr.io/jair25x/gateway-service:${GATEWAY_TAG}
    container_name: gateway-service
    env_file: [./.env]
    environment:
      <<: *jvm-opts
      SPRING_PROFILES_ACTIVE: prod
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-service:8888
      SPRING_BOOT_ADMIN_CLIENT_URL: http://admin-monitoring-service:9090
      JWT_SECRET: ${JWT_SECRET}
      REDIS_HOST: advisor-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    depends_on:
      eureka-server: { condition: service_healthy }
      config-service: { condition: service_healthy }
      advisor-redis: { condition: service_healthy }
      admin-monitoring-service: { condition: service_started }
    ports: []
    networks: [tesis-network]
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://localhost:8080/actuator/health/liveness || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    deploy:
      resources:
        limits: { cpus: "1.00", memory: "512M" }

  # === Eureka (interno) ===
  eureka-server:
    image: ghcr.io/jair25x/eureka-server:${EUREKA_TAG}
    container_name: eureka-server
    env_file: [./.env]
    environment:
      <<: *jvm-opts
      SPRING_PROFILES_ACTIVE: prod
      EUREKA_PUBLIC_URL: http://eureka-server:8761/eureka/
    ports: []
    networks: [tesis-network]
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8761/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 120s
    deploy:
      resources:
        limits: { cpus: "0.50", memory: "384M" }

  # === Config Server (interno) ===
  config-service:
    image: ghcr.io/jair25x/config-service:${CONFIG_TAG}
    container_name: config-service
    env_file: [./.env]
    environment:
      <<: *jvm-opts
      SPRING_PROFILES_ACTIVE: prod
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    ports: []
    networks: [tesis-network]
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://localhost:8888/actuator/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: "0.50", memory: "384M" }

  # === Admin (Spring Boot Admin; Caddy lo publica en admin.*) ===
  admin-monitoring-service:
    image: ghcr.io/jair25x/admin-monitoring-service:${ADMIN_TAG}
    container_name: admin-monitoring-service
    env_file: [./.env]
    environment:
      <<: *jvm-opts
      SPRING_PROFILES_ACTIVE: prod
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      eureka-server: { condition: service_healthy }
    ports: []
    networks: [tesis-network]
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://localhost:9090/actuator/health || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 15
    deploy:
      resources:
        limits: { cpus: "0.50", memory: "384M" }

  # === Redis endurecido (interno) ===
  advisor-redis:
    image: redis:7-alpine
    container_name: advisor-redis
    env_file: [./.env]
    command: [
      "redis-server",
      "--appendonly", "yes",
      "--save", "60 1000",
      "--rename-command", "CONFIG", "",
      "--rename-command", "FLUSHALL", "",
      "--requirepass", "${REDIS_PASSWORD}",
      "--protected-mode", "yes"
    ]
    volumes:
      - redis-data:/data
    ports: []
    networks: [tesis-network]
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "PING"]
      interval: 10s
      timeout: 5s
      retries: 15
    deploy:
      resources:
        limits: { cpus: "0.25", memory: "256M" }

  # === Postgres por servicio (internos, sin puertos) ===
  auth-profile-db:
    image: postgres:17.5-alpine3.22
    container_name: auth-profile-db
    env_file: [./.env]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_AUTH_PASSWORD}
      POSTGRES_DB: tesisdb_auth
    volumes: ["auth-profile-db-data:/var/lib/postgresql/data"]
    ports: []
    networks: [tesis-network]
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tesisdb_auth"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: "0.50", memory: "512M" }

  content-db:
    image: postgres:17.5-alpine3.22
    container_name: content-db
    env_file: [./.env]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_CONTENT_PASSWORD}
      POSTGRES_DB: contentdb
    volumes: ["content-db-data:/var/lib/postgresql/data"]
    ports: []
    networks: [tesis-network]
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d contentdb"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: "0.50", memory: "512M" }

  progress-db:
    image: postgres:17.5-alpine3.22
    container_name: progress-db
    env_file: [./.env]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PROGRESS_PASSWORD}
      POSTGRES_DB: progressdb
    volumes: ["progress-db-data:/var/lib/postgresql/data"]
    ports: []
    networks: [tesis-network]
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d progressdb"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: "0.50", memory: "512M" }

  classroom-db:
    image: postgres:17.5-alpine3.22
    container_name: classroom-db
    env_file: [./.env]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_CLASSROOM_PASSWORD}
      POSTGRES_DB: classroomdb
    volumes: ["classroom-db-data:/var/lib/postgresql/data"]
    ports: []
    networks: [tesis-network]
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d classroomdb"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: "0.50", memory: "512M" }

  assessment-db:
    image: postgres:17.5-alpine3.22
    container_name: assessment-db
    env_file: [./.env]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_ASSESSMENT_PASSWORD}
      POSTGRES_DB: assessmentdb
    volumes: ["assessment-db-data:/var/lib/postgresql/data"]
    ports: []
    networks: [tesis-network]
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d assessmentdb"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: "0.50", memory: "512M" }

  advisor-db:
    image: pgvector/pgvector:pg17
    container_name: advisor-db
    env_file: [./.env]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_ADVISOR_PASSWORD}
      POSTGRES_DB: advisordb
    volumes: ["advisor-db-data:/var/lib/postgresql/data"]
    ports: []
    networks: [tesis-network]
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d advisordb"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: "0.50", memory: "512M" }

  duels-db:
    image: postgres:17.5-alpine3.22
    container_name: duels-db
    env_file: [./.env]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_DUELS_PASSWORD}
      POSTGRES_DB: duelsdb
    volumes: ["duels-db-data:/var/lib/postgresql/data"]
    ports: []
    networks: [tesis-network]
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d duelsdb"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: "0.50", memory: "512M" }

  # === Microservicios Java (internos; los ve el gateway) ===
  auth-service:
    image: ghcr.io/jair25x/auth-service:${AUTH_TAG}
    container_name: auth-service
    env_file: [./.env]
    environment:
      <<: *jvm-opts
      SPRING_PROFILES_ACTIVE: prod
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-service:8888
      SPRING_BOOT_ADMIN_CLIENT_URL: http://admin-monitoring-service:9090
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-profile-db:5432/tesisdb_auth
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_AUTH_PASSWORD}
      S2S_JWT_SECRET: ${S2S_JWT_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      BOOTSTRAP_ADMIN: "true" # solo primer despliegue
      BOOTSTRAP_ADMIN_USERNAME: "admin"
      BOOTSTRAP_ADMIN_PASSWORD: "admin"
      BOOTSTRAP_ADMIN_EMAIL: "almanzajair5@gmail.com"
    depends_on:
      auth-profile-db: { condition: service_healthy }
      config-service: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
      admin-monitoring-service: { condition: service_started }
    ports: []
    networks: [tesis-network]
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: "0.75", memory: "640M" }

  curriculum-service:
    image: ghcr.io/jair25x/curriculum-service:${CURRICULUM_TAG}
    container_name: curriculum-service
    env_file: [./.env]
    environment:
      <<: *jvm-opts
      SPRING_PROFILES_ACTIVE: prod
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-service:8888
      SPRING_BOOT_ADMIN_CLIENT_URL: http://admin-monitoring-service:9090
      SPRING_DATASOURCE_URL: jdbc:postgresql://content-db:5432/contentdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_CONTENT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      S2S_JWT_SECRET: ${S2S_JWT_SECRET}
      S2S_JWT_ISSUER: ai-advisor-service
    depends_on:
      content-db: { condition: service_healthy }
      config-service: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
      admin-monitoring-service: { condition: service_started }
    ports: []
    networks: [tesis-network]
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://localhost:8082/actuator/health/liveness || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    deploy:
      resources:
        limits: { cpus: "0.75", memory: "640M" }

  progress-service:
    image: ghcr.io/jair25x/progress-service:${PROGRESS_TAG}
    container_name: progress-service
    env_file: [./.env]
    environment:
      <<: *jvm-opts
      SPRING_PROFILES_ACTIVE: prod
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-service:8888
      SPRING_BOOT_ADMIN_CLIENT_URL: http://admin-monitoring-service:9090
      SPRING_DATASOURCE_URL: jdbc:postgresql://progress-db:5432/progressdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PROGRESS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      S2S_JWT_SECRET: ${S2S_JWT_SECRET}
    depends_on:
      progress-db: { condition: service_healthy }
      config-service: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
      admin-monitoring-service: { condition: service_started }
    ports: []
    networks: [tesis-network]
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://localhost:8083/actuator/health/liveness || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    deploy:
      resources:
        limits: { cpus: "0.75", memory: "640M" }

  classroom-service:
    image: ghcr.io/jair25x/classroom-service:${CLASSROOM_TAG}
    container_name: classroom-service
    env_file: [./.env]
    environment:
      <<: *jvm-opts
      SPRING_PROFILES_ACTIVE: prod
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-service:8888
      SPRING_BOOT_ADMIN_CLIENT_URL: http://admin-monitoring-service:9090
      SPRING_DATASOURCE_URL: jdbc:postgresql://classroom-db:5432/classroomdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_CLASSROOM_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET}
      S2S_JWT_SECRET: ${S2S_JWT_SECRET}
    depends_on:
      classroom-db: { condition: service_healthy }
      config-service: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
      admin-monitoring-service: { condition: service_started }
    ports: []
    networks: [tesis-network]
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: "0.75", memory: "640M" }

  assessment-service:
    image: ghcr.io/jair25x/assessment-service:${ASSESSMENT_TAG}
    container_name: assessment-service
    env_file: [./.env]
    environment:
      <<: *jvm-opts
      SPRING_PROFILES_ACTIVE: prod
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-service:8888
      SPRING_BOOT_ADMIN_CLIENT_URL: http://admin-monitoring-service:9090
      SPRING_DATASOURCE_URL: jdbc:postgresql://assessment-db:5432/assessmentdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_ASSESSMENT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      S2S_JWT_SECRET: ${S2S_JWT_SECRET}
    depends_on:
      assessment-db: { condition: service_healthy }
      config-service: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
      admin-monitoring-service: { condition: service_started }
    ports: []
    networks: [tesis-network]
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: "0.75", memory: "640M" }

  # === FastAPI (internos) ===
  ai-advisor-service:
    image: ghcr.io/jair25x/ai-advisor-service:${AI_ADVISOR_TAG}
    container_name: ai-advisor-service
    env_file: [./.env]
    environment:
      ENV: prod
      PORT: 8086
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_ADVISOR_PASSWORD}@advisor-db:5432/advisordb
      REDIS_URL: redis://:${REDIS_PASSWORD}@advisor-redis:6379/0
      RATE_LIMIT_REDIS_URL: redis://:${REDIS_PASSWORD}@advisor-redis:6379/0
      CURRICULUM_BASE_URL: http://curriculum-service:8082
      PROGRESS_BASE_URL: http://progress-service:8083
      CHAT_PERSISTENCE_ENABLED: "true"
      STRICT_JSON_UTF8: "false"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      S2S_JWT_SECRET: ${S2S_JWT_SECRET}
      PUBLIC_JWT_SECRET: ${JWT_SECRET}
      S2S_JWT_ISSUER: ai-advisor-service
      RAG_TOP_K: 3
      RECO_K: 8
      CACHE_TTL_SECONDS: 1800
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      UVICORN_WORKERS: 2
      CHAT_USE_LLM: "true"
      LLM_REQUEST_TIMEOUT: 12
      LLM_MAX_TOKENS: 320
      LLM_TEMPERATURE: 0.3
      OPENAI_EMBED_MODEL: text-embedding-3-small
      EMB_REQUEST_TIMEOUT: 12
      BEHIND_GATEWAY: "true"
      EUREKA_SERVER: ${EUREKA_URL}
      EUREKA_APP_NAME: AI-ADVISOR-SERVICE
      ADVISOR_HOST: ai-advisor-service
      HEALTH_URL: http://ai-advisor-service:8086/healthz
      HOME_URL:   http://ai-advisor-service:8086/docs
    depends_on:
      advisor-db: { condition: service_healthy }
      advisor-redis: { condition: service_healthy }
      curriculum-service: { condition: service_healthy }
      progress-service: { condition: service_healthy }
    networks: [tesis-network]
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8086/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: "0.75", memory: "512M" }

  duels-service:
    image: ghcr.io/jair25x/duels-service:${DUELS_TAG}
    container_name: duels-service
    env_file: [./.env]
    environment:
      PORT: 8087
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_DUELS_PASSWORD}@duels-db:5432/duelsdb
      REDIS_URL: redis://:${REDIS_PASSWORD}@advisor-redis:6379/2
      RATE_LIMIT_REDIS_URL: redis://:${REDIS_PASSWORD}@advisor-redis:6379/1
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGS: HS512,HS384,HS256
      CURRICULUM_BASE: http://curriculum-service:8082
      PROGRESS_BASE: http://progress-service:8083
      CLASSROOM_BASE: http://classroom-service:8084
      S2S_JWT_SECRET: ${S2S_JWT_SECRET}
      S2S_JWT_ISSUER: ai-advisor-service
      DUELS_PICK_RETRIES: 5
      DUELS_FAIL_ON_EMPTY_ROUND: "false"
      DUELS_OPEN_MAX_AGE_H: 24
      LOG_LEVEL: INFO
      UVICORN_LOG_LEVEL: info
      BEHIND_GATEWAY: "true"
      EUREKA_SERVER: ${EUREKA_URL}
      EUREKA_APP_NAME: DUELS-SERVICE
      DUELS_HOST: duels-service
      HEALTH_URL: http://duels-service:8087/healthz
      HOME_URL:   http://duels-service:8087/docs
    depends_on:
      duels-db: { condition: service_healthy }
      advisor-redis: { condition: service_healthy }
      curriculum-service: { condition: service_healthy }
    networks: [tesis-network]
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8087/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: "0.75", memory: "512M" }

  # === Monitoring (interno) ===
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: []
    networks: [tesis-network]
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      gateway-service: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "0.50", memory: "256M" }

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    env_file: [./.env]
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
    ports: []
    networks: [tesis-network]
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      prometheus: { condition: service_started }
    deploy:
      resources:
        limits: { cpus: "0.50", memory: "256M" }
