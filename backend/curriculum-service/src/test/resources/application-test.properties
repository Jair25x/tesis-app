# Deshabilita la importación de configuración externa (Config Server)
spring.config.import=optional:

# Deshabilita el cliente de Spring Cloud Config para los tests
spring.cloud.config.enabled=false

# Deshabilita el cliente de Eureka Discovery para los tests
spring.cloud.discovery.enabled=false

# Configuración de H2 Database para tests de integración/unidad (asegura en memoria)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# Esto asegura una DB limpia para cada corrida de tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
# Especificar el dialecto de H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Propiedades JWT (si son necesarias para el filtro de seguridad en tests)
jwt.secret-key=CGFo4jI6B+Xp8vQ7L3K2J1I0H9G8F7E6D5C4B3A2S1D0F9E8D7C6B5A4S3D2F1G0H9I8J7K6L5M4N3O2P1Q0R9S8T7U6V5W4X3Y2Z1A0B1C2D3E4F5G6H7I8J9K0L1M2N3O4P5Q6R7S8T9U0V1W2X3Y4Z==
jwt.expirationMs=300000
jwt.refreshExpirationMs=600000
# ✅ Asegura logs detallados
logging.level.com.tesis.curriculum_service=DEBUG
# ✅ Útil para depurar Spring Security
logging.level.org.springframework.security=DEBUG
logging.file.name=logs/test.log
logging.level.root=DEBUG
# Errores en el GlobalExceptionHandler
logging.level.com.tesis.curriculum_service.exception=DEBUG
