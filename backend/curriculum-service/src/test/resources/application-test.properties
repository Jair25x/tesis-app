spring.config.import=optional:
spring.cloud.config.enabled=false
spring.cloud.discovery.enabled=false

# Testcontainers JDBC
spring.datasource.url=jdbc:tc:postgresql:16-alpine:///testdb
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.test.database.replace=none

# JWT y logging
jwt.secret-key=test-key
jwt.expirationMs=300000
jwt.refreshExpirationMs=600000
logging.level.com.tesis.curriculum_service=DEBUG
logging.level.org.springframework.security=DEBUG
logging.file.name=logs/test.log
logging.level.root=INFO
logging.level.org.hibernate.tool.schema=DEBUG