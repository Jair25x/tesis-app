# src/main/resources/data/curriculum-math-6.yml
code: "CURR-MATH-6"
name: "Currículo de Matemática - Sexto grado"
description: "Programa oficial basado en el texto del MINEDU (bloque 1)."
grade: "6°"
competencies:
  - code: "C.1"
    name: "BIENVENIDOS"
    description: "Bloque 1: Introducción a tablas, patrones, prismas, múltiplos y divisores."
    standards:
      - code: "S.1.1"
        name: "Ficha 1: Juntamos las tablas"
        description: "Organizar y representar datos en tablas."
        learningObjectives:
          - code: "LO.1.1.1"
            name: "Analizar tablas de frecuencia"
            description: "Interpretar tablas con datos estadísticos simples."
            exercises:
              # 🧠 EJERCICIO 1 (ya existente)
              - statement: |
                  Observa la siguiente tabla de actividades preferidas por estudiantes de 4.º grado:

                  | Actividad | Frecuencia |
                  |-----------|------------|
                  | Ajedrez   | 10         |
                  | Cantar    | 12         |
                  | Bailar    | 8          |
                  | Otras     | 5          |

                  ¿Cuál es la actividad más preferida?
                difficulty: "BASIC"
                type: "CHOICE"
                templateType: "FREQUENCY_ANALYSIS"
                parameters:
                  choices: ["Ajedrez", "Cantar", "Bailar", "Otras"]
                correctAnswer: "Cantar"
                hints:
                  - hintText: "Busca la actividad con el número más alto en la columna Frecuencia."
                    cost: 1
                solutionSteps:
                  - stepNumber: 1
                    explanation: "Observa los valores en la columna Frecuencia."
                  - stepNumber: 2
                    explanation: "Cantar tiene la frecuencia más alta (12)."
                  - stepNumber: 3
                    explanation: "Por lo tanto, la moda es Cantar."

              # 🧠 EJERCICIO 2
              - statement: |
                  Se entrevistó a 20 estudiantes sobre su deporte favorito. Los resultados fueron:

                  | Deporte     | Frecuencia |
                  |-------------|------------|
                  | Fútbol      | 7          |
                  | Básquet     | 4          |
                  | Natación    | 6          |
                  | Vóley       | 3          |

                  ¿Cuántos estudiantes prefieren natación o vóley?
                difficulty: "BASIC"
                type: "OPEN"
                templateType: "FREQUENCY_TOTAL"
                parameters: {}
                correctAnswer: "9"
                hints:
                  - hintText: "Suma las frecuencias de Natación y Vóley."
                    cost: 1
                solutionSteps:
                  - stepNumber: 1
                    explanation: "Frecuencia de natación: 6"
                  - stepNumber: 2
                    explanation: "Frecuencia de vóley: 3"
                  - stepNumber: 3
                    explanation: "6 + 3 = 9"

              # 🧠 EJERCICIO 3
              - statement: |
                  ¿Cuál fue el deporte menos popular según la tabla anterior?
                difficulty: "BASIC"
                type: "CHOICE"
                templateType: "FREQUENCY_ANALYSIS"
                parameters:
                  choices: ["Fútbol", "Básquet", "Natación", "Vóley"]
                correctAnswer: "Vóley"
                hints:
                  - hintText: "Observa la frecuencia más baja."
                    cost: 1
                solutionSteps:
                  - stepNumber: 1
                    explanation: "Busca el deporte con menor frecuencia."
                  - stepNumber: 2
                    explanation: "Vóley tiene la menor frecuencia (3)."
                  - stepNumber: 3
                    explanation: "La respuesta es Vóley."

              # 🧠 EJERCICIO 4
              - statement: |
                  De la siguiente tabla:

                  | Actividad      | Frecuencia |
                  |----------------|------------|
                  | Lectura        | 5          |
                  | Videojuegos    | 11         |
                  | Deportes       | 9          |
                  | Dibujo         | 5          |

                  ¿Qué actividades tienen la misma frecuencia?
                difficulty: "BASIC"
                type: "CHOICE"
                templateType: "FREQUENCY_ANALYSIS"
                parameters:
                  choices:
                    [
                      "Lectura y Videojuegos",
                      "Lectura y Dibujo",
                      "Dibujo y Deportes",
                      "Lectura y Deportes",
                    ]
                correctAnswer: "Lectura y Dibujo"
                hints:
                  - hintText: "Busca los valores que se repiten en la columna Frecuencia."
                    cost: 1
                solutionSteps:
                  - stepNumber: 1
                    explanation: "Lectura tiene frecuencia 5, Dibujo también."
                  - stepNumber: 2
                    explanation: "Ambas tienen la misma frecuencia."
