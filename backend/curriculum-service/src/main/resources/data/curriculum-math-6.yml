# src/main/resources/data/curriculum-math-6.yml
code: "CURR-MATH-6"
name: "Currículo de Matemática - Sexto grado"
description: "Programa oficial basado en el texto del MINEDU (bloque 1)."
grade: "6°"
competencies:
  - code: "C.1"
    name: "BIENVENIDOS"
    description: "Bloque 1: Introducción a tablas, patrones, prismas, múltiplos y divisores."
    standards:
      - code: "S.1.1"
        name: "Ficha 1: Juntamos las tablas"
        description: "Organizar y representar datos en tablas."
        learningObjectives:
          - code: "LO.1.1.1"
            name: "Analizar tablas de frecuencia"
            description: "Interpretar tablas con datos estadísticos simples."
            exercises:
              - statement: |
                  Observa la siguiente tabla de actividades preferidas por estudiantes de 4.º grado:

                  | Actividad | Frecuencia |
                  |-----------|------------|
                  | Ajedrez   | 10         |
                  | Cantar    | 12         |
                  | Bailar    | 8          |
                  | Otras     | 5          |

                  ¿Cuál es la actividad más preferida?
                difficulty: "BASIC"
                type: "CHOICE"
                templateType: "FREQUENCY_ANALYSIS"
                parameters:
                  choices: ["Ajedrez", "Cantar", "Bailar", "Otras"]
                correctAnswer: "Cantar"
                hints:
                  - hintText: "Busca la actividad con el número más alto en la columna Frecuencia."
                    cost: 1
                solutionSteps:
                  - stepNumber: 1
                    explanation: "Observa los valores en la columna Frecuencia."
                  - stepNumber: 2
                    explanation: "Cantar tiene la frecuencia más alta (12)."
                  - stepNumber: 3
                    explanation: "Por lo tanto, la moda es Cantar."
  - code: "C.2"
    name: "CANTIDAD Y OPERACIONES"
    description: "Resolver situaciones de multiplicación y valor posicional."
    standards:
      - code: "S.2.1"
        name: "Ficha 2: Candados y decenas"
        description: "Aplicar multiplicación con unidades de medida y valor posicional."
        learningObjectives:
          - code: "LO.2.1.1"
            name: "Resolver problemas con multiplicación en contextos reales"
            description: "Usar operaciones para resolver problemas sobre cantidades."
            exercises:
              - statement: |
                  Eliana compró 9 cajas de candados para su ferretería.  
                  Cada caja contiene 1 decena de candados y cada candado será vendido a S/ 18.00.  

                  ¿Cuánto dinero recibirá Eliana por la venta del total de cajas de candados?
                difficulty: "BASIC"
                type: "CHOICE"
                templateType: "BASIC_OPERATIONS"
                parameters:
                  choices:
                    - "S/ 180.00"
                    - "S/ 1620.00"
                    - "S/ 1800.00"
                correctAnswer: "S/ 1620.00"
                hints:
                  - hintText: "Primero calcula cuántos candados tiene en total."
                    cost: 1
                  - hintText: "Multiplica la cantidad total de candados por el precio de venta."
                    cost: 2
                solutionSteps:
                  - stepNumber: 1
                    explanation: "Cada caja tiene 10 candados (1 decena)."
                  - stepNumber: 2
                    explanation: "9 cajas x 10 candados = 90 candados."
                  - stepNumber: 3
                    explanation: "90 candados x S/ 18.00 = S/ 1620.00."
