# src/main/resources/data/curriculum-math-6.yml
code: "CN-MATH-6"
name: "Currículo Nacional de Matemática - 6.º Grado"
description: "Define los aprendizajes fundamentales en Matemática para el 6.º grado de primaria en Perú (EBR 2016)."
grade: "6.º Grado"

competencies:
  - code: "C.1"
    name: "BIENVENIDOS"
    description: "Bloque 1: Introducción a tablas, patrones, prismas, múltiplos y divisores."
    standards:
      - code: "S.1.1"
        name: "Ficha 1: Juntamos las tablas"
        description: "Organizar y representar datos en tablas."
        learningObjectives:
          - code: "LO.1.1.1"
            name: "Crear y leer tablas"
            description: "Construir y analizar tablas para organizar información."
      - code: "S.1.2"
        name: "Ficha 2: Usamos la probabilidad para tomar decisiones"
        description: "Introducción a eventos simples y probabilidad."
        learningObjectives:
          - code: "LO.1.2.1"
            name: "Calcular probabilidades"
            description: "Determinar la probabilidad de eventos básicos."
      - code: "S.1.3"
        name: "Ficha 3: Construimos prismas con plantillas"
        description: "Montaje de prismas y comprensión de volumen."
        learningObjectives:
          - code: "LO.1.3.1"
            name: "Construir prismas"
            description: "Usar plantillas para ensamblar prismas y explorar su volumen."
      - code: "S.1.4"
        name: "Ficha 4: Jugamos a formar patrones"
        description: "Identificación y extensión de patrones numéricos y geométricos."
        learningObjectives:
          - code: "LO.1.4.1"
            name: "Reconocer patrones"
            description: "Descubrir la regla detrás de secuencias y dibujos."
      - code: "S.1.5"
        name: "Ficha 5: Representamos la belleza de los números primos"
        description: "Descubrimiento y clasificación de números primos."
        learningObjectives:
          - code: "LO.1.5.1"
            name: "Identificar números primos"
            description: "Reconocer y listar números primos en distintos contextos."
      - code: "S.1.6"
        name: "Ficha 6: Buscamos los múltiplos de un número"
        description: "Cálculo y patrones de múltiplos."
        learningObjectives:
          - code: "LO.1.6.1"
            name: "Calcular múltiplos"
            description: "Generar y usar múltiplos en problemas de reparto."
      - code: "S.1.7"
        name: "Ficha 7: Jugamos con los múltiplos"
        description: "Aplicaciones lúdicas de múltiplos."
        learningObjectives:
          - code: "LO.1.7.1"
            name: "Explorar múltiplos"
            description: "Utilizar múltiplos en juegos y patrones."
      - code: "S.1.8"
        name: "Ficha 8: ¿Cuándo coincidiremos?"
        description: "Problemas de sincronización de patrones."
        learningObjectives:
          - code: "LO.1.8.1"
            name: "Resolver coincidencias"
            description: "Determinar cuándo dos secuencias se alinean."
      - code: "S.1.9"
        name: "Ficha 9: Buscamos los divisores de un número"
        description: "Identificación y uso de divisores."
        learningObjectives:
          - code: "LO.1.9.1"
            name: "Identificar divisores"
            description: "Listar divisores y aplicarlos en repartos exactos."
      - code: "S.1.10"
        name: "Ficha 10: Buscamos el mayor divisor común"
        description: "Cálculo del MCD y sus propiedades."
        learningObjectives:
          - code: "LO.1.10.1"
            name: "Calcular el MCD"
            description: "Usar el algoritmo de Euclides para hallar el MCD."
      - code: "S.1.11"
        name: "Ficha 11: Desafíos con múltiplos y divisores"
        description: "Problemas mixtos de múltiplos y divisores."
        learningObjectives:
          - code: "LO.1.11.1"
            name: "Resolver problemas mixtos"
            description: "Aplicar múltiplos y divisores en situaciones reales."

  - code: "C.2"
    name: "AVANZAMOS"
    description: "Bloque 2: Gráficos, volumen, proporcionalidad y operaciones mixtas."
    standards:
      - code: "S.2.1"
        name: "Ficha 12: Interpretamos gráficos de barras dobles"
        description: "Comparación de dos conjuntos de datos."
        learningObjectives:
          - code: "LO.2.1.1"
            name: "Analizar barras dobles"
            description: "Extraer conclusiones comparando gráficas."
      - code: "S.2.2"
        name: "Ficha 13: ¿Qué resultados son probables?"
        description: "Experimentos de probabilidad compuesta."
        learningObjectives:
          - code: "LO.2.2.1"
            name: "Calcular probabilidades compuestas"
            description: "Usar conteo y diagramas en eventos múltiples."
      - code: "S.2.3"
        name: "Ficha 14: ¿Qué caja tiene mayor volumen?"
        description: "Cálculo y comparación de volúmenes."
        learningObjectives:
          - code: "LO.2.3.1"
            name: "Comparar volúmenes"
            description: "Aplicar fórmulas de área de base por altura."
      - code: "S.2.4"
        name: "Ficha 15: ¿Dónde están las figuras circulares?"
        description: "Identificación de partes del círculo."
        learningObjectives:
          - code: "LO.2.4.1"
            name: "Reconocer componentes"
            description: "Nombrar circunferencia, arco y radio."
      - code: "S.2.5"
        name: "Ficha 16: Construimos un proyecto con cilindros"
        description: "Montaje y volumen de cilindros."
        learningObjectives:
          - code: "LO.2.5.1"
            name: "Construir cilindros"
            description: "Usar plantillas para armar cilindros."
      - code: "S.2.6"
        name: "Ficha 17: ¿Cuál es la proporcionalidad entre magnitudes?"
        description: "Razones y proporciones."
        learningObjectives:
          - code: "LO.2.6.1"
            name: "Resolver proporciones"
            description: "Aplicar regla de tres simple."
      - code: "S.2.7"
        name: "Ficha 18: Encontramos el valor unitario"
        description: "Cálculo por unidad."
        learningObjectives:
          - code: "LO.2.7.1"
            name: "Calcular valor unitario"
            description: "Dividir cantidad total por número de unidades."
      - code: "S.2.8"
        name: "Ficha 19: Resolvemos problemas de comparación y combinación"
        description: "Operaciones mixtas y comparación."
        learningObjectives:
          - code: "LO.2.8.1"
            name: "Analizar operaciones mixtas"
            description: "Desglosar problemas en pasos elementales."
      - code: "S.2.9"
        name: "Ficha 20: ¿Cuál es el resultado de las operaciones?"
        description: "Orden de operaciones (PEMDAS)."
        learningObjectives:
          - code: "LO.2.9.1"
            name: "Aplicar orden de operaciones"
            description: "Evaluar expresiones complejas correctamente."
      - code: "S.2.10"
        name: "Ficha 21: ¿Cuál es el significado de una potencia?"
        description: "Exponentes como multiplicaciones reiteradas."
        learningObjectives:
          - code: "LO.2.10.1"
            name: "Interpretar potencias"
            description: "Relacionar exponentes con repeticiones."
      - code: "S.2.11"
        name: "Ficha 22: ¿Cómo es el reparto equitativo?"
        description: "División exacta y repartos."
        learningObjectives:
          - code: "LO.2.11.1"
            name: "Realizar divisiones exactas"
            description: "Repartir cantidades de forma equitativa."
      - code: "S.2.12"
        name: "Ficha 23: Resolvemos problemas con números mixtos"
        description: "Operaciones con números mixtos."
        learningObjectives:
          - code: "LO.2.12.1"
            name: "Operar con mixtos"
            description: "Sumar y restar números mixtos."

  - code: "C.3"
    name: "VAMOS PROGRESANDO"
    description: "Bloque 3: Estadística, probabilidad, perímetro, área y decimales."
    standards:
      - code: "S.3.1"
        name: "Ficha 24: Leemos gráficos estadísticos"
        description: "Interpretación de gráficos diversos."
        learningObjectives:
          - code: "LO.3.1.1"
            name: "Analizar gráficos"
            description: "Extraer información de pictogramas y gráficas."
      - code: "S.3.2"
        name: "Ficha 25: Experimentamos con la probabilidad"
        description: "Experimentos y conteo de resultados."
        learningObjectives:
          - code: "LO.3.2.1"
            name: "Diseñar experimentos"
            description: "Calcular frecuencias y probabilidades."
      - code: "S.3.3"
        name: "Ficha 26: ¿Hay relación entre el perímetro y el área?"
        description: "Exploración de perímetro vs. área."
        learningObjectives:
          - code: "LO.3.3.1"
            name: "Comparar perímetro y área"
            description: "Analizar cómo cambia el área al modificar perímetro."
      - code: "S.3.4"
        name: "Ficha 27: Construimos triángulos"
        description: "Clasificación y construcción de triángulos."
        learningObjectives:
          - code: "LO.3.4.1"
            name: "Construir triángulos"
            description: "Usar reglas para dibujar y clasificar triángulos."
      - code: "S.3.5"
        name: "Ficha 28: Descubrimos el valor desconocido"
        description: "Resolución de ecuaciones sencillas."
        learningObjectives:
          - code: "LO.3.5.1"
            name: "Resolver ecuaciones"
            description: "Encontrar la incógnita en ecuaciones de primer grado."
      - code: "S.3.6"
        name: "Ficha 29: Representamos números decimales"
        description: "Lectura y escritura de decimales."
        learningObjectives:
          - code: "LO.3.6.1"
            name: "Leer y escribir decimales"
            description: "Representar decimales en la recta numérica."
      - code: "S.3.7"
        name: "Ficha 30: Comparamos y ordenamos decimales"
        description: "Comparación y orden en decimales."
        learningObjectives:
          - code: "LO.3.7.1"
            name: "Comparar decimales"
            description: "Ordenar decimales de menor a mayor."
      - code: "S.3.8"
        name: "Ficha 31: Sumamos con decimales"
        description: "Suma de números decimales."
        learningObjectives:
          - code: "LO.3.8.1"
            name: "Sumar decimales"
            description: "Realizar sumas con alineación de puntos decimales."
      - code: "S.3.9"
        name: "Ficha 32: Restamos con decimales"
        description: "Resta de números decimales."
        learningObjectives:
          - code: "LO.3.9.1"
            name: "Restar decimales"
            description: "Efectuar restas con decimales correctamente."
      - code: "S.3.10"
        name: "Ficha 33: ¿Cuánto más que y menos que?"
        description: "Comparaciones de magnitudes."
        learningObjectives:
          - code: "LO.3.10.1"
            name: "Comparar diferencias"
            description: "Calcular cuánto más o menos hay entre valores."

  - code: "C.4"
    name: "NUEVOS DESAFÍOS"
    description: "Bloque 4: Promedio, probabilidades avanzadas, áreas, ecuaciones e inecuaciones."
    standards:
      - code: "S.4.1"
        name: "Ficha 34: Calculamos el promedio"
        description: "Cálculo de media aritmética."
        learningObjectives:
          - code: "LO.4.1.1"
            name: "Calcular promedio"
            description: "Sumar datos y dividir por su cantidad."
      - code: "S.4.2"
        name: "Ficha 35: Jugamos con dados y la probabilidad"
        description: "Experimentos con dados."
        learningObjectives:
          - code: "LO.4.2.1"
            name: "Analizar lanzamientos"
            description: "Calcular probabilidades en lanzamientos de dados."
      - code: "S.4.3"
        name: "Ficha 36: Calculamos el área de rectángulos y triángulos"
        description: "Fórmulas de área básicas."
        learningObjectives:
          - code: "LO.4.3.1"
            name: "Calcular áreas"
            description: "Usar base y altura en rectángulos y triángulos."
      - code: "S.4.4"
        name: "Ficha 37: Calculamos el área de paralelogramos"
        description: "Área de paralelogramos."
        learningObjectives:
          - code: "LO.4.4.1"
            name: "Calcular área de paralelogramos"
            description: "Aplicar fórmula base×altura."
      - code: "S.4.5"
        name: "Ficha 38: Ampliamos y reducimos figuras"
        description: "Escalado de figuras planas."
        learningObjectives:
          - code: "LO.4.5.1"
            name: "Escalar figuras"
            description: "Calcular nuevas medidas al ampliar o reducir."
      - code: "S.4.6"
        name: "Ficha 39: Resolvemos ecuaciones"
        description: "Ecuaciones lineales sencillas."
        learningObjectives:
          - code: "LO.4.6.1"
            name: "Resolver ecuaciones"
            description: "Aislar la incógnita en ecuaciones de primer grado."
      - code: "S.4.7"
        name: "Ficha 40: Resolvemos inecuaciones"
        description: "Inecuaciones lineales."
        learningObjectives:
          - code: "LO.4.7.1"
            name: "Resolver inecuaciones"
            description: "Determinar intervalos solución."
      - code: "S.4.8"
        name: "Ficha 41: ¿Cómo multiplicamos números decimales?"
        description: "Multiplicación con decimales."
        learningObjectives:
          - code: "LO.4.8.1"
            name: "Multiplicar decimales"
            description: "Alinear y multiplicar decimales correctamente."
      - code: "S.4.9"
        name: "Ficha 42: ¿Cómo dividimos números decimales?"
        description: "División con decimales."
        learningObjectives:
          - code: "LO.4.9.1"
            name: "Dividir decimales"
            description: "Realizar divisiones llevando el punto decimal."
      - code: "S.4.10"
        name: "Ficha 43: ¿Cómo resolvemos problemas con operaciones combinadas?"
        description: "Operaciones combinadas con decimales."
        learningObjectives:
          - code: "LO.4.10.1"
            name: "Resolver operaciones combinadas"
            description: "Aplicar orden de operaciones con decimales."
      - code: "S.4.11"
        name: "Ficha 44: Descubrimos números más allá de los miles"
        description: "Números grandes y su notación."
        learningObjectives:
          - code: "LO.4.11.1"
            name: "Leer números grandes"
            description: "Interpretar y escribir números mayores a 1 000."
      - code: "S.4.12"
        name: "Ficha 45: Relacionamos fracción decimal y porcentaje"
        description: "Conversión entre fracción decimal y porcentaje."
        learningObjectives:
          - code: "LO.4.12.1"
            name: "Convertir entre decimal y porcentaje"
            description: "Transformar decimales en porcentajes y viceversa."
