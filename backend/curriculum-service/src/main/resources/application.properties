# ----------------------------------------
# Curriculum-Service – application.properties
# ----------------------------------------

# 1) Nombre de la aplicación (para Eureka & Config Server)
spring.application.name=curriculum-service

# 2) Cliente de Spring Cloud Config
spring.cloud.config.enabled=true
spring.config.import=optional:configserver:

spring.cloud.config.uri=http://config-service:8888
# 3) Eureka Discovery Client
spring.cloud.discovery.enabled=true

# 5) Logging a nivel de tu paquete
logging.level.com.tesis.curriculum_service=DEBUG

# 6) Swagger/OpenAPI (springdoc) – rutas base
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Preferir la dirección IP en el registro de Eureka (útil en entornos dockerizados o VMs)
eureka.instance.prefer-ip-address=true

# Frecuencia con la que este servicio enviará "heartbeats" a Eureka
eureka.instance.lease-renewal-interval-in-seconds=10
# 7) (Opcional) Perfil por defecto en desarrollo local
# Lo ideal es que lo pongas via ENV (SPRING_PROFILES_ACTIVE) en Docker Compose,
# pero si quieres un valor por defecto descomenta:
# spring.profiles.active=dev
