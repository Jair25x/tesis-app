# =========================================
# Spring Boot Application Properties
# for curriculum-service
# =========================================

# --- Spring Application Settings ---
spring.application.name=curriculum-service
# Propósito: Define el nombre de la aplicación.
# Por qué: Este nombre es fundamental para que Eureka Server registre el servicio bajo este identificador
#          y para que Config Server sepa qué archivo de configuración (ej. 'curriculum-service.yml') debe proporcionar.

# --- Spring Cloud Config Client Settings ---
# Habilita el cliente de Spring Cloud Config.
spring.cloud.config.enabled=true
# Propósito: Permite que este microservicio busque su configuración en el Spring Cloud Config Server.
# Por qué: Centraliza la gestión de configuraciones, permitiendo cambios dinámicos sin reconstruir el servicio
#          y gestionando perfiles por entorno (desarrollo, producción, etc.) de forma eficiente.

# URL del Config Server. 'optional:' significa que la aplicación arrancará incluso si el Config Server no está disponible
# al inicio, aunque luego intentará conectarse. Esto es útil en ciertos escenarios de arranque, pero es mejor tener el
# Config Server levantado primero.
spring.config.import=optional:configserver:http://localhost:8888
# Propósito: Indica la URL donde el Config Server está escuchando las peticiones de configuración.
# Por qué: Es la dirección explícita donde el servicio buscará sus archivos de configuración remotos (ej. curriculum-service.yml).
#          'optional:' es un prefijo de Spring Boot 2.4+ que permite que la aplicación arranque si el Config Server no está disponible.
#          Aunque es útil, para la mayoría de los casos de desarrollo y CI/CD, querrás que el Config Server esté online.

# --- Eureka Discovery Client Settings ---
# Habilita el cliente de Eureka Discovery.
spring.cloud.discovery.enabled=true
# Propósito: Permite que este microservicio se registre con Eureka Server y descubra otros microservicios.
# Por qué: Eureka es tu servidor de descubrimiento de servicios, esencial para que los microservicios
#          se encuentren entre sí (ej., Gateway encuentra Auth Service, Educational Content Service encuentra Curriculum Service)
#          sin necesidad de conocer sus IPs y puertos directamente.

# URL del Eureka Server.
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
# Propósito: Define la URL de tu Eureka Server.
# Por qué: Es la dirección a la que este microservicio se conectará para registrarse y obtener información de otros servicios.

# Registra la dirección IP del microservicio en Eureka en lugar del hostname.
eureka.instance.prefer-ip-address=true
# Propósito: Le dice a Eureka que registre la dirección IP de la instancia en lugar del nombre de host.
# Por qué: En entornos de Docker o Kubernetes, la IP es a menudo más estable y predecible que los nombres de host,
#          especialmente si la resolución de nombres DNS no está perfectamente configurada entre contenedores.

# Genera un ID de instancia único para este servicio en Eureka.
eureka.instance.instance-id=${spring.application.name}:${random.uuid}
# Propósito: Crea un ID único para cada instancia del servicio.
# Por qué: Si ejecutas múltiples instancias del mismo servicio, Eureka las distinguirá por este ID.
#          "${spring.application.name}" usa el nombre del servicio, y "${random.uuid}" añade una parte aleatoria
#          para asegurar la unicidad incluso si el nombre de la aplicación es el mismo.

# Frecuencia con la que el cliente renueva su "lease" (contrato) con Eureka.
eureka.instance.lease-renewal-interval-in-seconds=10
# Propósito: Establece cada cuánto tiempo el microservicio envía un "heartbeat" a Eureka.
# Por qué: Asegura que Eureka sepa que la instancia está viva. Si no se renueva el lease, Eureka la desregistrará.

# Tiempo que Eureka espera antes de quitar una instancia si no se renueva el lease.
eureka.instance.lease-expiration-duration-in-seconds=30
# Propósito: Tiempo máximo de inactividad antes de que Eureka elimine una instancia.
# Por qué: Proporciona tolerancia a fallos. Si una instancia falla o se detiene inesperadamente, Eureka
#          la quitará del registro después de este período, evitando que otros servicios intenten conectarse a una instancia muerta.
logging.level.com.tesis.curriculum_service=DEBUG

# --- Spring Boot Admin Client Settings ---
spring.boot.admin.client.url=http://admin-monitoring-service:9090
management.endpoints.web.exposure.include=health,info

