spring:
  application:
    name: config-service
  profiles:
    active: dev

server:
  port: 8888

management:
  endpoints:
    web:
      exposure:
        include: "*"     # en dev lo filtramos por perfil
  endpoint:
    prometheus:
      access: unrestricted    # reemplaza .enabled
  prometheus:
    metrics:
      export:
        enabled: true         # reemplaza management.metrics.export.prometheus.enabled
