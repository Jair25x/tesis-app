spring:
  config:
    activate:
      on-profile: dev
  boot:
    admin:
      client:
        url: http://admin-monitoring-service:9090
        instance:
          metadata:
            user:
              name: admin
              password: admin

  cloud:
    config:
      server:
        git:
          uri: https://github.com/Jair25x/tesis-config-repo.git
          default-label: main
          search-paths: .
          basedir: /data/git
          username: Jair25x
          password: ${GITHUB_TOKEN}
          clone-on-start: true
          force-pull: true
          timeout: 30

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterAccess=600s

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    prometheus:
      access: unrestricted
  prometheus:
    metrics:
      export:
        enabled: true
