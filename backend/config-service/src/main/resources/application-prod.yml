spring:
  config:
    activate:
      on-profile: prod

  cloud:
    config:
      server:
        git:
          uri: https://github.com/Jair25x/tesis-config-repo
          default-label: main
          search-paths: .
          username: Jair25x
          password: ${GITHUB_TOKEN}
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://eureka.prod.tesis.com/eureka/
