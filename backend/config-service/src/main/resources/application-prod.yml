spring:
  config:
    activate:
      on-profile: prod

  cloud:
    config:
      server:
        git:
          uri: https://github.com/Jair25x/tesis-config-repo
          default-label: main
          search-paths: .
          username: Jair25x
          password: ${GITHUB_TOKEN}
          basedir: /data/git
          clone-on-start: true
          timeout: 30
          force-pull: true
          refresh-rate: 30

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://eureka.prod.tesis.com/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
    access:
      default: read-only
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
    prometheus:
      access: unrestricted
  prometheus:
    metrics:
      export:
        enabled: true
