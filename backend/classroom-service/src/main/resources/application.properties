# ----------------------------------------
# Classroom-Service – application.properties
# ----------------------------------------

# Nombre del servicio (Config Server / Eureka)
spring.application.name=classroom-service

# Cliente de Spring Cloud Config
spring.cloud.config.enabled=true
spring.config.import=optional:configserver:
spring.cloud.config.uri=http://config-service:8888

# Descubrimiento
spring.cloud.discovery.enabled=true

# Actuator: exposición mínima para Admin UI (el resto se habilita por perfil)
management.endpoints.web.exposure.include=health,info

# Logging del paquete
logging.level.com.tesis.classroom_service=DEBUG

# Swagger/OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Eureka hints para contenedores
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=10

# Perfil por defecto -> usar env SPRING_PROFILES_ACTIVE en Docker Compose
# spring.profiles.active=dev