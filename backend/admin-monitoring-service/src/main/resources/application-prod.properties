spring.application.name=admin-monitoring-service
server.port=${PORT:9090}

# Eureka interno
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# En prod, solo lo necesario (agrega prometheus!)
management.endpoints.web.exposure.include=health,info,prometheus
# Política de acceso por defecto (opcional): solo lectura
management.endpoints.access.default=read-only
# Prometheus debe poderse scrapear
management.endpoint.prometheus.access=unrestricted

# Prometheus export
management.prometheus.metrics.export.enabled=true

spring.boot.admin.client.enabled=false
