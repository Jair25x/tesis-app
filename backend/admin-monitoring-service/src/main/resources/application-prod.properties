spring.application.name=admin-monitoring-service
server.port=${PORT:9090}

# Usa variable de entorno si el dominio cambia en producción
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:https://eureka.midominio.com/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Menos información en producción
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=NEVER

spring.boot.admin.client.enabled=false