spring.application.name=admin-monitoring-service
server.port=9090

# Eureka
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Actuator dev
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# Prometheus (nuevo esquema)
management.endpoint.prometheus.access=unrestricted
management.prometheus.metrics.export.enabled=true

# Este servicio es SERVIDOR de SBA
spring.boot.admin.client.enabled=false

spring.boot.admin.monitor.default-timeout=10000
spring.boot.admin.monitor.status-interval=15000
spring.boot.admin.monitor.status-lifetime=60000

# opcional:
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true