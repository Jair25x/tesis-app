# ----------------------------------------
# avatar-service – application.properties (mínimo local)
# Toda la config real vendrá desde Config Server (BASE/DEV/PROD)
# ----------------------------------------

spring.application.name=avatar-service

# Spring Cloud Config (usa tu config-service en la red interna)
spring.cloud.config.enabled=true
spring.config.import=optional:configserver:
spring.cloud.config.uri=http://config-service:8888
spring.cloud.discovery.enabled=true

# Eureka
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=10

# Actuator (exposición real se define en config-repo; aquí solo paths)
management.endpoints.web.exposure.include=health,info,prometheus

# OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# JPA sane defaults (reales en config-repo)
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

# Logging: apunta al paquete correcto
logging.level.com.tesis.avatar_service=INFO
