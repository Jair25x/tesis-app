x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

# JVM opts como en prod (útil para memoria/GC y TZ)
x-jvm-opts: &jvm-opts
  JAVA_TOOL_OPTIONS: >
    -XX:+UseContainerSupport
    -XX:MaxRAMPercentage=70
    -XX:InitialRAMPercentage=30
    -XX:+AlwaysActAsServerClassMachine
    -XX:+TieredCompilation
    -XX:+ExitOnOutOfMemoryError
    -Duser.timezone=America/Lima

# Healthcheck nativo Spring: liveness (más estable en arranque)
# Usamos wget (BusyBox suele incluirlo) para evitar dependencia de curl.
x-health-http-liveness: &health-http-liveness
  test:
    - CMD-SHELL
    - |
      if command -v wget >/dev/null 2>&1; then
        wget -qO- "http://localhost:${SERVER_PORT:-8080}/actuator/health/liveness" >/dev/null || exit 1
      elif command -v curl >/dev/null 2>&1; then
        curl -sf "http://localhost:${SERVER_PORT:-8080}/actuator/health/liveness" >/dev/null || exit 1
      else
        echo "No wget/curl available in container"; exit 1
      fi
  interval: 15s
  timeout: 5s
  retries: 20
  start_period: 40s

networks:
  tesis-network:
    driver: bridge

volumes:
  auth-profile-db-data:
  content-db-data:
  progress-db-data:
  classroom-db-data:
  assessment-db-data:
  advisor-db-data:
  duels-db-data:
  redis-data:
  config-git-cache:

services:
  # === Infra (dev) ===
  eureka-server:
    build:
      context: .
      dockerfile: ./eureka-server/Dockerfile
    container_name: eureka-server
    environment:
      <<: *jvm-opts
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8761
    ports: ["8761:8761"]
    restart: on-failure
    networks: [tesis-network]
    logging: *default-logging
    # Para eureka basta comprobar el root
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://localhost:8761/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s

  admin-monitoring-service:
    build:
      context: .
      dockerfile: ./admin-monitoring-service/Dockerfile
    container_name: admin-monitoring-service
    environment:
      <<: *jvm-opts
      SPRING_PROFILES_ACTIVE: dev
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SERVER_PORT: 9090
    ports: ["9090:9090"]
    depends_on:
      eureka-server: { condition: service_healthy }
    restart: on-failure
    networks: [tesis-network]
    logging: *default-logging
    healthcheck: *health-http-liveness

  config-service:
    build:
      context: .
      dockerfile: ./config-service/Dockerfile
    container_name: config-service
    environment:
      <<: *jvm-opts
      SPRING_PROFILES_ACTIVE: dev
      GITHUB_TOKEN: ${GITHUB_TOKEN:-""}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SERVER_PORT: 8888
    ports: ["8888:8888"]
    depends_on:
      eureka-server: { condition: service_healthy }
    restart: on-failure
    networks: [tesis-network]
    logging: *default-logging
    healthcheck:
      test:
        - CMD-SHELL
        - |
          curl -sf "http://127.0.0.1:${SERVER_PORT:-8888}/actuator/health" >/dev/null || exit 1
      interval: 15s
      timeout: 5s
      retries: 60
      start_period: 120s
    volumes:
      - config-git-cache:/data/git

  advisor-redis:
    image: redis:7-alpine
    container_name: advisor-redis
    command: >
      sh -c "echo 'appendonly yes' > /etc/redis.conf
      && echo 'save 60 1000' >> /etc/redis.conf
      && echo 'requirepass ${REDIS_PASSWORD:-devredis}' >> /etc/redis.conf
      && redis-server /etc/redis.conf"
    ports: ["6380:6379"]
    volumes: ["redis-data:/data"]
    restart: unless-stopped
    networks: [tesis-network]
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-devredis}", "PING"]
      interval: 10s
      timeout: 3s
      retries: 12

  # === PostgreSQL (dev) ===
  auth-profile-db:
    image: postgres:17.5-alpine3.22
    container_name: auth-profile-db
    environment:
      POSTGRES_DB: tesisdb_auth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_AUTH_PASSWORD:-misan}
    ports: ["5432:5432"]
    volumes: ["auth-profile-db-data:/var/lib/postgresql/data"]
    restart: unless-stopped
    networks: [tesis-network]
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tesisdb_auth"]
      interval: 10s
      timeout: 3s
      retries: 12

  content-db:
    image: postgres:17.5-alpine3.22
    container_name: content-db
    environment:
      POSTGRES_DB: contentdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_CONTENT_PASSWORD:-misan}
    ports: ["5433:5432"]
    volumes: ["content-db-data:/var/lib/postgresql/data"]
    restart: unless-stopped
    networks: [tesis-network]
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d contentdb"]
      interval: 10s
      timeout: 3s
      retries: 12

  progress-db:
    image: postgres:17.5-alpine3.22
    container_name: progress-db
    environment:
      POSTGRES_DB: progressdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PROGRESS_PASSWORD:-misan}
    ports: ["5444:5432"]
    volumes: ["progress-db-data:/var/lib/postgresql/data"]
    restart: unless-stopped
    networks: [tesis-network]
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d progressdb"]
      interval: 10s
      timeout: 3s
      retries: 12

  classroom-db:
    image: postgres:17.5-alpine3.22
    container_name: classroom-db
    environment:
      POSTGRES_DB: classroomdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_CLASSROOM_PASSWORD:-misan}
    ports: ["5445:5432"]
    volumes: ["classroom-db-data:/var/lib/postgresql/data"]
    restart: unless-stopped
    networks: [tesis-network]
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d classroomdb"]
      interval: 10s
      timeout: 3s
      retries: 12

  assessment-db:
    image: postgres:17.5-alpine3.22
    container_name: assessment-db
    environment:
      POSTGRES_DB: assessmentdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ASSESSMENT_PASSWORD:-misan}
    ports: ["5446:5432"]
    volumes: ["assessment-db-data:/var/lib/postgresql/data"]
    restart: unless-stopped
    networks: [tesis-network]
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d assessmentdb"]
      interval: 10s
      timeout: 3s
      retries: 12

  advisor-db:
    image: pgvector/pgvector:pg17
    container_name: advisor-db
    environment:
      POSTGRES_DB: advisordb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADVISOR_PASSWORD:-misan}
    ports: ["5447:5432"]
    volumes: ["advisor-db-data:/var/lib/postgresql/data"]
    restart: unless-stopped
    networks: [tesis-network]
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d advisordb"]
      interval: 10s
      timeout: 3s
      retries: 12

  duels-db:
    image: postgres:17.5-alpine3.22
    container_name: duels-db
    environment:
      POSTGRES_DB: duelsdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_DUELS_PASSWORD:-misan}
    ports: ["5448:5432"]
    volumes: ["duels-db-data:/var/lib/postgresql/data"]
    restart: unless-stopped
    networks: [tesis-network]
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d duelsdb"]
      interval: 10s
      timeout: 3s
      retries: 12

  # === Microservicios Java (dev) ===
  gateway-service:
    build:
      context: .
      dockerfile: ./gateway-service/Dockerfile
    container_name: gateway-service
    environment:
      <<: *jvm-opts
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8080
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_CLOUD_CONFIG_URI: http://config-service:8888
      JWT_SECRET: ${JWT_SECRET}
      REDIS_HOST: advisor-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-devredis}
      ALLOWED_ORIGINS: http://localhost:5173
    ports: ["8080:8080"]
    depends_on:
      eureka-server: { condition: service_healthy }
      config-service: { condition: service_healthy }
      advisor-redis: { condition: service_healthy }
    restart: on-failure
    networks: [tesis-network]
    logging: *default-logging
    healthcheck: *health-http-liveness

  auth-service:
    build:
      context: .
      dockerfile: ./auth-service/Dockerfile
    container_name: auth-service
    environment:
      <<: *jvm-opts
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8081
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_CLOUD_CONFIG_URI: http://config-service:8888
      SPRING_BOOT_ADMIN_CLIENT_URL: http://admin-monitoring-service:9090
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-profile-db:5432/tesisdb_auth
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_AUTH_PASSWORD:-misan}
      S2S_JWT_SECRET: ${S2S_JWT_SECRET}
      JWT_SECRET: ${JWT_SECRET}
    ports: ["8081:8081"]
    depends_on:
      eureka-server: { condition: service_healthy }
      config-service: { condition: service_healthy }
      admin-monitoring-service: { condition: service_started }
      auth-profile-db: { condition: service_healthy }
    restart: on-failure
    networks: [tesis-network]
    logging: *default-logging
    healthcheck: *health-http-liveness

  curriculum-service:
    build:
      context: .
      dockerfile: ./curriculum-service/Dockerfile
    container_name: curriculum-service
    environment:
      <<: *jvm-opts
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8082
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_CLOUD_CONFIG_URI: http://config-service:8888
      SPRING_BOOT_ADMIN_CLIENT_URL: http://admin-monitoring-service:9090
      SPRING_DATASOURCE_URL: jdbc:postgresql://content-db:5432/contentdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_CONTENT_PASSWORD:-misan}
      JWT_SECRET: ${JWT_SECRET}
      S2S_JWT_SECRET: ${S2S_JWT_SECRET}
      S2S_JWT_ISSUER: ai-advisor-service
    ports: ["8082:8082"]
    depends_on:
      eureka-server: { condition: service_healthy }
      config-service: { condition: service_healthy }
      admin-monitoring-service: { condition: service_started }
      content-db: { condition: service_healthy }
    restart: on-failure
    networks: [tesis-network]
    logging: *default-logging
    healthcheck: *health-http-liveness

  progress-service:
    build:
      context: .
      dockerfile: ./progress-service/Dockerfile
    container_name: progress-service
    environment:
      <<: *jvm-opts
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8083
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_CLOUD_CONFIG_URI: http://config-service:8888
      SPRING_BOOT_ADMIN_CLIENT_URL: http://admin-monitoring-service:9090
      SPRING_DATASOURCE_URL: jdbc:postgresql://progress-db:5432/progressdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PROGRESS_PASSWORD:-misan}
      JWT_SECRET: ${JWT_SECRET}
      S2S_JWT_SECRET: ${S2S_JWT_SECRET}
    ports: ["8083:8083"]
    depends_on:
      eureka-server: { condition: service_healthy }
      config-service: { condition: service_healthy }
      progress-db: { condition: service_healthy }
    restart: on-failure
    networks: [tesis-network]
    logging: *default-logging
    healthcheck: *health-http-liveness

  classroom-service:
    build:
      context: .
      dockerfile: ./classroom-service/Dockerfile
    container_name: classroom-service
    environment:
      <<: *jvm-opts
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8084
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_CLOUD_CONFIG_URI: http://config-service:8888
      SPRING_BOOT_ADMIN_CLIENT_URL: http://admin-monitoring-service:9090
      SPRING_DATASOURCE_URL: jdbc:postgresql://classroom-db:5432/classroomdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_CLASSROOM_PASSWORD:-misan}
      S2S_JWT_SECRET: ${S2S_JWT_SECRET}
      JWT_SECRET: ${JWT_SECRET}
    ports: ["8084:8084"]
    depends_on:
      eureka-server: { condition: service_healthy }
      config-service: { condition: service_healthy }
      classroom-db: { condition: service_healthy }
    restart: on-failure
    networks: [tesis-network]
    logging: *default-logging
    healthcheck: *health-http-liveness

  assessment-service:
    build:
      context: .
      dockerfile: ./assessment-service/Dockerfile
    container_name: assessment-service
    environment:
      <<: *jvm-opts
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8085
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_CLOUD_CONFIG_URI: http://config-service:8888
      SPRING_BOOT_ADMIN_CLIENT_URL: http://admin-monitoring-service:9090
      SPRING_DATASOURCE_URL: jdbc:postgresql://assessment-db:5432/assessmentdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_ASSESSMENT_PASSWORD:-misan}
      JWT_SECRET: ${JWT_SECRET}
      S2S_JWT_SECRET: ${S2S_JWT_SECRET}
    ports: ["8085:8085"]
    depends_on:
      eureka-server: { condition: service_healthy }
      config-service: { condition: service_healthy }
      assessment-db: { condition: service_healthy }
    restart: on-failure
    networks: [tesis-network]
    logging: *default-logging
    healthcheck: *health-http-liveness

  # === Microservicios Python (dev) ===
  ai-advisor-service:
    build:
      context: .
      dockerfile: ./ai-advisor-service/Dockerfile
    container_name: ai-advisor-service
    environment:
      LOG_LEVEL: DEBUG
      UVICORN_LOG_LEVEL: debug
      UVICORN_ACCESS_LOG: "1"
      ENV: dev
      SERVER_PORT: 8086
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_ADVISOR_PASSWORD:-misan}@advisor-db:5432/advisordb
      REDIS_URL: redis://:${REDIS_PASSWORD:-devredis}@advisor-redis:6379/0
      RATE_LIMIT_REDIS_URL: redis://:${REDIS_PASSWORD:-devredis}@advisor-redis:6379/0
      CURRICULUM_BASE_URL: http://curriculum-service:8082
      PROGRESS_BASE_URL: http://progress-service:8083
      CHAT_PERSISTENCE_ENABLED: "true"
      CHAT_USE_LLM: "true"
      CHAT_FALLBACK_MODE: llm
      STRICT_JSON_UTF8: "false"
      CHAT_LLM_MODEL: ${CHAT_LLM_MODEL}
      OPENAI_EMBED_MODEL: ${OPENAI_EMBED_MODEL}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-""}
      S2S_JWT_SECRET: ${S2S_JWT_SECRET}
      PUBLIC_JWT_SECRET: ${JWT_SECRET}
      S2S_JWT_ISSUER: ai-advisor-service
      RAG_TOP_K: 3
      RECO_K: 8
      CACHE_TTL_SECONDS: 1800
      ALLOWED_ORIGINS: http://localhost:5173
      UVICORN_WORKERS: 2
      LLM_REQUEST_TIMEOUT: 12
      LLM_MAX_TOKENS: 320
      LLM_TEMPERATURE: 0.3
      EUREKA_SERVER: http://eureka-server:8761/eureka/
      EUREKA_APP_NAME: AI-ADVISOR-SERVICE
      EUREKA_PREFER_IP: "false"
      ADVISOR_HOST: ai-advisor-service
      HEALTH_URL: http://ai-advisor-service:8086/healthz
      HOME_URL: http://ai-advisor-service:8086/docs
      BEHIND_GATEWAY: "true"
    ports: ["8086:8086"]
    depends_on:
      advisor-db: { condition: service_healthy }
      advisor-redis: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
      # Nota: no bloqueamos por curriculum/progress; consumirá cuando estén listos
    restart: on-failure
    networks: [tesis-network]
    logging: *default-logging
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://localhost:${SERVER_PORT:-8086}/healthz | grep -i 'ok' >/dev/null || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s

  duels-service:
    build:
      context: .
      dockerfile: ./duels-service/Dockerfile
    container_name: duels-service
    environment:
      SERVER_PORT: 8087
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_DUELS_PASSWORD:-misan}@duels-db:5432/duelsdb
      REDIS_URL: redis://:${REDIS_PASSWORD:-devredis}@advisor-redis:6379/2
      RATE_LIMIT_REDIS_URL: redis://:${REDIS_PASSWORD:-devredis}@advisor-redis:6379/1
      RATE_LIMIT_MATCHES_PER_MIN: 10
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGS: HS512,HS384,HS256
      CURRICULUM_BASE: http://curriculum-service:8082
      PROGRESS_BASE: http://progress-service:8083
      CLASSROOM_BASE: http://classroom-service:8084
      S2S_JWT_SECRET: ${S2S_JWT_SECRET}
      S2S_JWT_ISSUER: ai-advisor-service
      EUREKA_SERVER: http://eureka-server:8761/eureka/
      EUREKA_APP_NAME: DUELS-SERVICE
      DUELS_HOST: duels-service
      LOG_LEVEL: INFO
      UVICORN_LOG_LEVEL: info
      HEALTH_URL: http://duels-service:8087/healthz
      HOME_URL: http://duels-service:8087/docs
      BEHIND_GATEWAY: "true"
    ports: ["8087:8087"]
    depends_on:
      duels-db: { condition: service_healthy }
      advisor-redis: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
      # Sin bloqueo por curriculum-service
    restart: on-failure
    networks: [tesis-network]
    logging: *default-logging
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://localhost:${SERVER_PORT:-8087}/healthz | grep -i 'ok' >/dev/null || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s

  # === Frontend (dev) ===
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: tesis-frontend:latest
    container_name: frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-/api}
    ports: ["80:80"]
    depends_on:
      gateway-service: { condition: service_healthy }
    restart: on-failure
    networks: [tesis-network]
    logging: *default-logging

  # === Observabilidad (dev) ===
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: prometheus
    ports: ["9091:9090"]
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: on-failure
    networks: [tesis-network]
    logging: *default-logging
    depends_on:
      gateway-service: { condition: service_healthy }

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    restart: on-failure
    networks: [tesis-network]
    logging: *default-logging
    depends_on:
      prometheus: { condition: service_started }
