[alembic]
script_location = alembic
# La URL real la sobreescribe app/alembic/env.py con settings.DATABASE_URL
sqlalchemy.url = postgresql+psycopg://postgres:postgres@localhost:5432/advisordb

# logging básico de alembic
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers = console
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)s %(name)s %(message)s
