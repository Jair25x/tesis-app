# ----------------------------------------
# Progress-Service – application.properties
# ----------------------------------------

# 1) Nombre (Eureka & Config)
spring.application.name=progress-service

# 2) Spring Cloud Config (habilitado y URI del config-service)
spring.cloud.config.enabled=true
spring.config.import=optional:configserver:
spring.cloud.config.uri=http://config-service:8888

# 3) Eureka Discovery
spring.cloud.discovery.enabled=true
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=10

# 4) Actuator mínimo (Admin UI lo ampliará según perfil del config-repo)
management.endpoints.web.exposure.include=health,info

# 5) Logging del paquete del servicio
logging.level.com.tesis.progress_service=DEBUG

# 6) Swagger/OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# 7) (Opcional) perfil por defecto solo para local
# spring.profiles.active=dev
