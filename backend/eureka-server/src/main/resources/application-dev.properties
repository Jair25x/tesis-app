# Puerto local
server.port=8761

# Nombre lógico de la app
spring.application.name=eureka-server

# Eureka no se registra a sí mismo
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Espera mínima en sincronización
eureka.server.wait-time-in-ms-when-sync-empty=0
eureka.server.enable-self-preservation=false

# Permitir monitoreo completo
management.endpoints.web.exposure.include=*

# Permite ver detalles del estado
management.endpoint.health.show-details=ALWAYS

# URL del Spring Boot Admin (dev)
# Esto para local sin docker
# spring.boot.admin.client.url=http://localhost:9090 
# Esto para docker
spring.boot.admin.client.url=http://admin-monitoring-service:9090

# Qué enviar como instancia
spring.boot.admin.client.instance.metadata.user.name=admin
spring.boot.admin.client.instance.metadata.user.password=admin