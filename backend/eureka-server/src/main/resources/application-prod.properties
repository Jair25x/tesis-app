# Puerto externo (puede ser sobrescrito con variable de entorno PORT)
server.port=${PORT:8761}

spring.application.name=eureka-server

# Eureka server no se registra a sí mismo
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# Fallback interno (evita "https://mi-dominio.com/eureka/")
eureka.client.service-url.defaultZone=${EUREKA_PUBLIC_URL:http://eureka-server:8761/eureka/}

# Espera un poco más al estar en producción
eureka.server.wait-time-in-ms-when-sync-empty=5000
eureka.server.enable-self-preservation=true

# Para Spring Boot Admin (salud e info solamente en prod)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=NEVER

spring.boot.admin.client.instance.metadata.user.name=admin
spring.boot.admin.client.instance.metadata.user.password=admin
