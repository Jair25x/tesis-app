server.port=${PORT:8761}
spring.application.name=eureka-server

eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.client.service-url.defaultZone=${EUREKA_PUBLIC_URL:http://eureka-server:8761/eureka/}

eureka.server.wait-time-in-ms-when-sync-empty=5000
eureka.server.enable-self-preservation=true

# Expón health, info y prometheus
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoints.access.default=read-only
management.endpoint.prometheus.access=unrestricted

# SBA metadata
spring.boot.admin.client.instance.metadata.user.name=admin
spring.boot.admin.client.instance.metadata.user.password=admin

# Prometheus
management.prometheus.metrics.export.enabled=true
