# Nombre de la aplicación (debe coincidir con el nombre del archivo en config-repo: auth-profile-service.yml)
spring.application.name=auth-service

# Puerto en el que se ejecutará este microservicio
server.port=8081

# Configuración del Spring Cloud Config Client
# Indica al servicio que cargue su configuración desde un Config Server
spring.config.import=optional:configserver:

# URL del Config Server.
# En un entorno Docker Compose, apunta al nombre del servicio 'config-service'.
# En producción (Railway), esta URL también se resolverá a la URL interna o externa del Config Server.
spring.cloud.config.uri=http://config-service:8888

# Perfil activo por defecto si no se especifica uno en el entorno.
# Puede sobrescribirse estableciendo la variable de entorno
# SPRING_PROFILES_ACTIVE=prod al desplegar.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Habilita el cliente de descubrimiento de servicios (para registrarse en Eureka)
spring.cloud.discovery.enabled=true

# URL del servidor Eureka al que este servicio se registrará.
# En un entorno Docker Compose, apunta al nombre del servicio 'eureka-server'.
# En producción (Railway), esta URL también se resolverá a la URL interna o externa de Eureka.
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/

# Preferir la dirección IP en el registro de Eureka (útil en entornos dockerizados o VMs)
eureka.instance.prefer-ip-address=true

# Frecuencia con la que este servicio enviará "heartbeats" a Eureka
eureka.instance.lease-renewal-interval-in-seconds=10