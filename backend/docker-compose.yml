version: "3.9"

services:
  eureka-server:
    build:
      context: .
      dockerfile: ./eureka-server/Dockerfile
    container_name: eureka-server
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.50"
    networks:
      - tesis-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/"]
      interval: 15s
      timeout: 5s
      retries: 10

  admin-monitoring-service:
    build:
      context: .
      dockerfile: ./admin-monitoring-service/Dockerfile
    container_name: admin-monitoring-service
    ports:
      - "9090:9090"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.30"
    networks:
      - tesis-network

  config-service:
    build:
      context: .
      dockerfile: ./config-service/Dockerfile
    container_name: config-service
    ports:
      - "8888:8888"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.30"
    networks:
      - tesis-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8888/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  gateway-service:
    build:
      context: .
      dockerfile: ./gateway-service/Dockerfile
    container_name: gateway-service
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - CONFIG_SERVER_URL=http://config-service:8888
    depends_on:
      - eureka-server
      - config-service
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.50"
    networks:
      - tesis-network

  # --- SERVICIO DE BASE DE DATOS PARA AUTH-PROFILE-SERVICE ---
  auth-profile-db:
    image: postgres:17.5-alpine3.22 # Imagen de PostgreSQL, versión 13, ligera
    container_name: auth-profile-db # Nombre del contenedor para fácil identificación
    ports:
      - "5432:5432" # Mapea el puerto 5432 del host al contenedor
    environment:
      - POSTGRES_DB=tesisdb_auth # Nombre de la base de datos
      - POSTGRES_USER=postgres # Usuario de la base de datos
      - POSTGRES_PASSWORD=misan # Contraseña del usuario
    volumes:
      - auth-profile-db-data:/var/lib/postgresql/data # Volumen para persistir los datos de la BD
    restart: always # Asegura que la BD siempre intente reiniciarse
    networks:
      - tesis-network # Conecta a la red de tus microservicios
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tesisdb_auth"]
      interval: 10s
      timeout: 3s
      retries: 10
    # Opcional: Puedes añadir la sección deploy aquí si planeas usar Docker Swarm.
    # Para desarrollo local con 'docker-compose up', esta sección será ignorada.
    # deploy:
    #   resources:
    #     limits:
    #       memory: 1024M # Las BDs suelen necesitar más memoria
    #       cpus: '1.0'

  # --- SERVICIO: Auth Service (Consolidación de Auth y User Profile) ---
  auth-service:
    build:
      context: .
      dockerfile: ./auth-service/Dockerfile
    container_name: auth-service
    ports:
      - "8081:8081" # Mapea el puerto 8081
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - CONFIG_SERVER_URL=http://config-service:8888
      - SPRING_BOOT_ADMIN_CLIENT_URL=http://admin-monitoring-service:9090
      - SPRING_BOOT_ADMIN_CLIENT_INSTANCE_METADATA_USER_NAME=admin
      - SPRING_BOOT_ADMIN_CLIENT_INSTANCE_METADATA_USER_PASSWORD=admin
      # --- Configuración de la Base de Datos para Auth-Profile Service ---
      # La URL ahora apunta al nombre del servicio de la BD en Docker Compose
      - SPRING_DATASOURCE_URL=jdbc:postgresql://auth-profile-db:5432/tesisdb_auth
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=misan
    depends_on:
      - eureka-server
      - config-service
      - admin-monitoring-service
      - auth-profile-db # Ahora depende del servicio de base de datos
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.50"
    networks:
      - tesis-network

  content-db:
    image: postgres:17.5-alpine3.22
    container_name: content-db
    environment:
      - POSTGRES_DB=contentdb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=misan
    volumes:
      - content-db-data:/var/lib/postgresql/data
    ports:
      - "5433:5432" # opcional, sólo si quieres exponerlo en el host
    restart: always
    networks:
      - tesis-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d contentdb"]
      interval: 10s
      timeout: 3s
      retries: 10

  curriculum-service:
    build:
      context: .
      dockerfile: ./curriculum-service/Dockerfile
    container_name: curriculum-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - CONFIG_SERVER_URL=http://config-service:8888
      - SPRING_BOOT_ADMIN_CLIENT_URL=http://admin-monitoring-service:9090
      - SPRING_BOOT_ADMIN_CLIENT_INSTANCE_SERVICE_BASE_URL=http://curriculum-service:8082
      - SPRING_BOOT_ADMIN_CLIENT_INSTANCE_MANAGEMENT_BASE_URL=http://curriculum-service:8082
      - SPRING_BOOT_ADMIN_CLIENT_INSTANCE_METADATA_USER_NAME=admin
      - SPRING_BOOT_ADMIN_CLIENT_INSTANCE_METADATA_USER_PASSWORD=admin
      # Conexión a la BD content-db
      - SPRING_DATASOURCE_URL=jdbc:postgresql://content-db:5432/contentdb
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=misan
    depends_on:
      - eureka-server
      - config-service
      - admin-monitoring-service
      - content-db
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.50"
    networks:
      - tesis-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  progress-db:
    image: postgres:17.5-alpine3.22
    container_name: progress-db
    environment:
      - POSTGRES_DB=progressdb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=misan
    ports:
      - "5444:5432" # opcional, expuesto en host
    volumes:
      - progress-db-data:/var/lib/postgresql/data
    restart: always
    networks:
      - tesis-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d progressdb"]
      interval: 10s
      timeout: 3s
      retries: 10

  progress-service:
    build:
      context: .
      dockerfile: ./progress-service/Dockerfile
    container_name: progress-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - CONFIG_SERVER_URL=http://config-service:8888
      - SPRING_BOOT_ADMIN_CLIENT_URL=http://admin-monitoring-service:9090
      - SPRING_BOOT_ADMIN_CLIENT_INSTANCE_SERVICE_BASE_URL=http://progress-service:8083
      - SPRING_BOOT_ADMIN_CLIENT_INSTANCE_MANAGEMENT_BASE_URL=http://progress-service:8083
      - SPRING_BOOT_ADMIN_CLIENT_INSTANCE_METADATA_USER_NAME=admin
      - SPRING_BOOT_ADMIN_CLIENT_INSTANCE_METADATA_USER_PASSWORD=admin
      # DB (apunta al servicio progress-db)
      - SPRING_DATASOURCE_URL=jdbc:postgresql://progress-db:5432/progressdb
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=misan
    depends_on:
      - eureka-server
      - config-service
      - admin-monitoring-service
      - progress-db
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.50"
    networks:
      - tesis-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10

# --- Definición de Volúmenes ---
volumes:
  auth-profile-db-data:
  content-db-data:
  progress-db-data:
# --- Definicion de Redes ---
networks:
  tesis-network:
    driver: bridge
