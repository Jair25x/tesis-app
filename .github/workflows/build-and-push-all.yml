name: Build & Push (all services)

on:
  push:
    branches: [ main ]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/build-and-push-all.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: build-and-push-all-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Un único TAG estable por batch: prod-YYYYMMDD-HHMM (UTC)
      - name: Compute TAG
        id: tag
        run: echo "TAG=prod-$(date -u +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Lowercase owner (GHCR namespace)
        id: ns
        run: echo "NS=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Docker login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Cache Maven para acelerar builds Java
      - name: Setup Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Warm Maven cache (monorepo backend)
        run: mvn -B -f backend/pom.xml -DskipTests package || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Helper para construir y pushear usando buildx con cache y contextos correctos
      - name: Build & Push images
        env:
          TAG: ${{ steps.tag.outputs.TAG }}
          NS:  ${{ steps.ns.outputs.NS }}
        run: |
          set -euo pipefail

          build_push () {
            local file="$1"
            local context="$2"
            local image="$3"

            echo ""
            echo "==> Building ${image}:${TAG}"
            docker buildx build \
              --file "${file}" \
              --tag "${image}:${TAG}" \
              --cache-from "type=gha,scope=${image}" \
              --cache-to   "type=gha,mode=max,scope=${image}" \
              --push \
              "${context}"
          }

          # --- JAVA services (contexto = ./backend) ---
          build_push backend/eureka-server/Dockerfile              ./backend  "${NS}/eureka-server"
          build_push backend/config-service/Dockerfile             ./backend  "${NS}/config-service"
          build_push backend/admin-monitoring-service/Dockerfile   ./backend  "${NS}/admin-monitoring-service"
          build_push backend/gateway-service/Dockerfile            ./backend  "${NS}/gateway-service"
          build_push backend/auth-service/Dockerfile               ./backend  "${NS}/auth-service"
          build_push backend/curriculum-service/Dockerfile         ./backend  "${NS}/curriculum-service"
          build_push backend/progress-service/Dockerfile           ./backend  "${NS}/progress-service"
          build_push backend/classroom-service/Dockerfile          ./backend  "${NS}/classroom-service"
          build_push backend/assessment-service/Dockerfile         ./backend  "${NS}/assessment-service"

          # --- FastAPI services (también dentro de ./backend) ---
          build_push backend/ai-advisor-service/Dockerfile         ./backend  "${NS}/ai-advisor-service"
          build_push backend/duels-service/Dockerfile              ./backend  "${NS}/duels-service"

          # --- Frontend (contexto = ./frontend) ---
          build_push frontend/Dockerfile                           ./frontend "${NS}/tesis-frontend"

          # Emitir archivo de TAGS para despliegue
          {
            echo "FRONTEND_TAG=${TAG}"
            echo "GATEWAY_TAG=${TAG}"
            echo "EUREKA_TAG=${TAG}"
            echo "CONFIG_TAG=${TAG}"
            echo "ADMIN_TAG=${TAG}"
            echo "AUTH_TAG=${TAG}"
            echo "CURRICULUM_TAG=${TAG}"
            echo "PROGRESS_TAG=${TAG}"
            echo "CLASSROOM_TAG=${TAG}"
            echo "ASSESSMENT_TAG=${TAG}"
            echo "AI_ADVISOR_TAG=${TAG}"
            echo "DUELS_TAG=${TAG}"
          } > tags.env

      - name: Upload tags.env artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-tags
          path: tags.env
          retention-days: 14
