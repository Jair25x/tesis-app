# user-service.yml
server:
  port: 8083 # Puerto para el User Service. Otro puerto diferente.

spring:
  application:
    name: user-service # Importante: debe coincidir con el artifactId del pom.xml

  datasource:
    url: jdbc:postgresql://localhost:5432/tesisdb_users # Puedes usar una base de datos diferente o la misma
    username: postgres
    password: misan
    # url: jdbc:postgresql://postgres_db:5432/tesisdb_users # Conexion Docker
    # username: useruser
    # password: userpass
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/ # URL de tu Eureka Server
  instance:
    prefer-ip-address: true # Para que Eureka registre la IP en lugar del hostname
    instance-id: ${spring.application.name}:${random.value}
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: "*" # Exponer todos los endpoints de Actuator para monitoreo