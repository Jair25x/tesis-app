# auth-service.yml (Configuración base para todos los perfiles)

server:
  port: 8081 # Puerto interno del contenedor. El mapeo externo se define en docker-compose.yml (8081)

spring:
  flyway:
      enabled: true
      locations: classpath:db/migration,classpath:/config-repo/auth-service/db/migration
  application:
    name: auth-service # Nombre de la aplicación consolidada para Eureka y Config Server

  jpa:
    hibernate:
      ddl-auto: update # Estrategia de Hibernate para la creación/actualización del esquema de la BD.
                       # 'update' intentará actualizar el esquema existente. Para producción, considera 'validate' o 'none'.
    show-sql: true # Muestra las sentencias SQL ejecutadas por Hibernate en la consola. Útil para depuración.
    properties:
      hibernate:
        format_sql: true # Formatea las sentencias SQL mostradas para una mejor legibilidad.
    database-platform: org.hibernate.dialect.PostgreSQLDialect # Especifica el dialecto de Hibernate para PostgreSQL.

jwt: # Sección de configuración para los JSON Web Tokens.
  secret-key: N/B9yH7L5A8t/Q2Z0X0Vw6M8vJ9Y4N1T3S2R1Q0P5O6N7M8L9K0J1I2H3G4F5E6D7C8B9A0B1C2D3E4F5G6H7I8J9K0L1M2N3O4P5Q6R7S8T9U0V1W2X3Y4ZabCdEfGhIjKlMnOpQrStUvWxYzABcDeFg==
  # Clave secreta para firmar y verificar JWTs. DEBE SER MUY SEGURA Y NO HARDCODEADA EN PRODUCCIÓN.
  # Esta clave debe ser larga y generada de forma segura.
  expirationMs: 3600000 # Tiempo de expiración del Access Token JWT en milisegundos (ej. 1 hora).
  refreshExpirationMs: 86400000 # Tiempo de expiración del Refresh Token en milisegundos (ej. 24 horas).

eureka: # Configuración para el cliente Eureka (para registrar este microservicio en el servidor Eureka).
  instance:
    prefer-ip-address: true # Registra la dirección IP en lugar del hostname con Eureka.
    instance-id: ${spring.application.name}:${random.uuid} # Genera un ID de instancia único.
    lease-renewal-interval-in-seconds: 10 # Frecuencia con la que el cliente renueva su "lease" (contrato) con Eureka.
    lease-expiration-duration-in-seconds: 30 # Tiempo que Eureka espera antes de quitar una instancia si no se renueva el lease.

management: # Configuración de Spring Boot Actuator.
  endpoints:
    web:
      exposure:
        include: "*" # Expone todos los endpoints de Actuator a través de HTTP. (En producción, expón solo los necesarios).
