server:
  port: 8082 # el puerto que has decidido para este servicio

spring:
  application:
    name: curriculum-service

  datasource:
    url: jdbc:postgresql://localhost:5432/content-db  # tu nuevo nombre de BD
    username: postgres
    password: misan

  jpa:
    hibernate:
      ddl-auto: update      # en base mantenemos que Hibernate sincronice el esquema
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret-key: N/B9yH7L5A8t/Q2Z0X0Vw6M8vJ9Y4N1T3S2R1Q0P5O6N7M8L9K0J1I2H3G4F5E6D7C8B9A0B1C2D3E4F5G6H7I8J9K0L1M2N3O4P5Q6R7S8T9U0V1W2X3Y4ZabCdEfGhIjKlMnOpQrStUvWxYzABcDeFg==
  expirationMs: 3600000
  refreshExpirationMs: 86400000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.uuid}

management:
  endpoints:
    web:
      exposure:
        include: "*"  # en base exponemos todo, los perfiles lo pueden restringir

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
