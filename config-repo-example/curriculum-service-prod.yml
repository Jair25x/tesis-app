spring:
  profiles: prod

  datasource:
    # En producción, apuntarás al host/servicio de BD real
    url: jdbc:postgresql://prod-db-host:5432/content-db
    username: prod_user
    password: "${DB_PASSWORD}" # se inyecta desde entorno o Secret Manager

  jpa:
    hibernate:
      # En prod validamos el esquema, no lo modificamos
      ddl-auto: validate
    show-sql: false

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

jwt:
  # misma clave compartida en todo el ecosistema
  secret-key: N/B9yH7L5A8t/Q2Z0X0Vw6M8vJ9Y4N1T3S2R1Q0P5O6N7M8L9K0J1I2H3G4F5E6D7C8B9A0B1C2D3E4F5G6H7I8J9K0L1M2N3O4P5Q6R7S8T9U0V1W2X3Y4ZabCdEfGhIjKlMnOpQrStUvWxYzABcDeFg==
  expirationMs: 3600000
  refreshExpirationMs: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
