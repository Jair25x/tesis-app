spring:
  boot:
    admin:
      client:
        url: http://admin-monitoring-service:9090
        discovery:
          enabled: true
        instance:
          metadata:
            user:
              name: admin
              password: admin

  profiles: dev

  datasource:
    # En Docker Compose, el servicio de BD se llama 'db'
    url: jdbc:postgresql://db:5432/content-db
    username: postgres
    password: misan

  jpa:
    hibernate:
      # En dev dejamos que Hibernate actualice el esquema
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
    # queremos que se registre y consulte el registry en dev
    register-with-eureka: true
    fetch-registry: true

