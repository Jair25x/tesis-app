services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: curriculum
      POSTGRES_USER: curriculum
      POSTGRES_PASSWORD: curriculum
    volumes:
      - dbdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U curriculum -d curriculum"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    image: tesis-frontend:local
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "http://localhost:8080" # si tienes gateway local
        # O apúntalo directo al curriculum-service para tests puntuales:
        # VITE_API_BASE_URL: "http://localhost:8081"
    ports:
      - "80:80"
    depends_on:
      - curriculum-service

volumes:
  dbdata:
