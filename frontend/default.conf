# frontend/default.conf
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # --- Seguridad básica ---
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # --- SSE necesita que NO se comprima ni se bufee ---
  gzip off;

  # ✅ Ruta específica del stream del chat (más específica que /api/)
  #    - Sin buffering, sin cache, timeouts altos
  location /api/ai/chat {
    proxy_pass http://gateway-service:8080/api/ai/chat;

    # HTTP/1.1 y no cerrar conexión
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Cabeceras forward
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-Host   $host;
    proxy_set_header X-Forwarded-Prefix /api;

    # SSE: sin buffering ni compresión en el proxy
    proxy_buffering off;
    proxy_set_header X-Accel-Buffering no;
    proxy_cache off;

    # Timeouts altos para streams
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # Proxy general /api -> gateway
  location /api/ {
    proxy_pass http://gateway-service:8080/api/;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-Host   $host;
    proxy_set_header X-Forwarded-Prefix /api;

    # (No forzamos buffering aquí para no afectar endpoints normales)
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
