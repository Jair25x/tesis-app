# frontend/default.conf  (este es el que copiamos a /etc/nginx/conf.d/default.conf)
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Cabeceras seguras
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # ✅ Proxy /api al gateway (mismo docker network)
  location /api/ {
    proxy_pass http://gateway-service:8080/api/;

    # Recomendado para proxys HTTP/1.1
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Prefix /api;

    # Si tu backend devuelve cookies con Path=/api y quieres reescribirlo, descomenta:
    # proxy_cookie_path /api/ /;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
