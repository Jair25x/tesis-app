# Mapea Upgrade/Connection para WebSocket
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # --- Seguridad básica ---
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Tamaño de uploads (ajusta si necesitas más)
  client_max_body_size 10m;

  # --- Importante para SSE ---
  # Evita gzip en respuestas stream (SSE)
  gzip off;

  # =========================================================
  # 1) WebSocket de Duelos  (ruta más específica, antes que /api/)
  # =========================================================
  location /api/duels/ws {
    proxy_pass http://gateway-service:8080/api/duels/ws;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Cabeceras forward
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-Host   $host;
    proxy_set_header X-Forwarded-Prefix /api;

    # Sin buffering para WS
    proxy_buffering off;

    # Timeouts generosos para partidas
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # =========================================================
  # 2) SSE del chat IA (más específica que /api/)
  # =========================================================
  location /api/ai/chat {
    proxy_pass http://gateway-service:8080/api/ai/chat;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-Host   $host;
    proxy_set_header X-Forwarded-Prefix /api;

    # Streaming limpio
    proxy_buffering off;
    proxy_set_header X-Accel-Buffering no;
    proxy_cache off;

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # =========================================================
  # 3) Proxy general /api -> gateway (HTTP normal)
  # =========================================================
  location /api/ {
    proxy_pass http://gateway-service:8080/api/;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-Host   $host;
    proxy_set_header X-Forwarded-Prefix /api;
  }

  # =========================================================
  # 4) Assets cacheables (mejor desempeño)
  # =========================================================
  location ~* \.(?:js|mjs|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # =========================================================
  # 5) SPA fallback (HTML sin cache agresiva)
  # =========================================================
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-store";
  }

  # =========================================================
  # 6) Health opcional (si prefieres apuntar aquí)
  # =========================================================
  location = /health {
    return 200 "OK";
    add_header Content-Type text/plain;
  }
}
