# frontend/default.conf
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # --- Seguridad básica ---
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # --- Importante para streams (SSE) ---
  gzip off;

  # =========================================================
  # WS de Duelos  (¡antes del /api/ genérico!)
  # =========================================================
  location /api/duels/ws {
    proxy_pass http://gateway-service:8080/api/duels/ws;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Cabeceras forward
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-Host   $host;
    proxy_set_header X-Forwarded-Prefix /api;

    # Evita buffering en proxied WS
    proxy_buffering off;

    # Timeouts altos para partidas
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # =========================================================
  # SSE del chat IA  (ruta más específica que /api/)
  # =========================================================
  location /api/ai/chat {
    proxy_pass http://gateway-service:8080/api/ai/chat;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-Host   $host;
    proxy_set_header X-Forwarded-Prefix /api;

    proxy_buffering off;
    proxy_set_header X-Accel-Buffering no;
    proxy_cache off;

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # =========================================================
  # Proxy general /api -> gateway (HTTP normal)
  # =========================================================
  location /api/ {
    proxy_pass http://gateway-service:8080/api/;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-Host   $host;
    proxy_set_header X-Forwarded-Prefix /api;
  }

  # =========================================================
  # SPA fallback
  # =========================================================
  location / {
    try_files $uri $uri/ /index.html;
  }
}
