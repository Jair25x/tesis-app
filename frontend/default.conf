# --- Resolver Docker DNS para re-resolver hosts en runtime ---
resolver 127.0.0.11 ipv6=off valid=10s;
resolver_timeout 5s;

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 80;
  server_name _;

  set $gw http://gateway-service:8080;

  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  client_max_body_size 10m;
  gzip off;

  proxy_connect_timeout 5s;
  proxy_read_timeout    3600s;
  proxy_send_timeout    3600s;
  proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;

  # 1) WS duelos (déjalo igual)
  location /api/duels/ws {
    proxy_pass $gw/api/duels/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-Host   $host;
    proxy_set_header X-Forwarded-Prefix /api;
    proxy_buffering off;
  }

  # 2) SSE chat (déjalo igual)
  location /api/ai/chat {
    proxy_pass $gw/api/ai/chat;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-Host   $host;
    proxy_set_header X-Forwarded-Prefix /api;

    proxy_buffering off;
    proxy_set_header X-Accel-Buffering no;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    proxy_set_header Accept-Encoding "";
    chunked_transfer_encoding off;
    proxy_intercept_errors off;
  }

  # 3) Proxy general /api -> gateway (SIN path en proxy_pass)
  location /api/ {
    proxy_pass $gw;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-Host   $host;
    # Si tu stack no usa este header, puedes quitarlo:
    # proxy_set_header X-Forwarded-Prefix /api;

    # Traza para verificar rutas
    proxy_set_header X-Original-URI     $request_uri;
  }

  # 4) Assets
  location ~* \.(?:js|mjs|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # 5) SPA
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-store";
  }

  # 6) Health
  location = /health {
    return 200 "OK";
    add_header Content-Type text/plain;
  }
}
