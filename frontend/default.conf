# --- Resolver Docker DNS para re-resolver hosts en runtime ---
resolver 127.0.0.11 ipv6=off valid=10s;
resolver_timeout 5s;

# Mapea Upgrade/Connection para WebSocket
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;

  # Upstream dinámico (variable) para el gateway
  set $gw http://gateway-service:8080;

  root /usr/share/nginx/html;
  index index.html;

  # --- Seguridad básica ---
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Tamaño de uploads
  client_max_body_size 10m;

  # --- Importante para SSE ---
  gzip off; # evita problemas con text/event-stream

  # --- Timeouts y tolerancia ---
  proxy_connect_timeout 5s;
  proxy_read_timeout    3600s;
  proxy_send_timeout    3600s;
  proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;

  # =========================================================
  # 1) WebSocket de Duelos (más específica, antes que /api/)
  # =========================================================
  location /api/duels/ws {
    proxy_pass $gw/api/duels/ws;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-Host   $host;
    proxy_set_header X-Forwarded-Prefix /api;

    proxy_buffering off;
  }

  # =========================================================
  # 2) SSE del chat IA (más específica que /api/)
  # =========================================================
  location /api/ai/chat {
    proxy_pass $gw/api/ai/chat;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-Host   $host;
    proxy_set_header X-Forwarded-Prefix /api;

    # --- SSE hardening ---
    proxy_buffering off;
    proxy_set_header X-Accel-Buffering no;
    proxy_cache off;

    # evitar headers que rompan SSE
    proxy_set_header Accept-Encoding "";
    chunked_transfer_encoding off;
    proxy_intercept_errors off;
  }

  # =========================================================
  # 3) Proxy general /api -> gateway (HTTP normal)
  # =========================================================
  location /api/ {
    proxy_pass $gw/api/;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-Host   $host;
    proxy_set_header X-Forwarded-Prefix /api;
  }

  # =========================================================
  # 4) Assets cacheables
  # =========================================================
  location ~* \.(?:js|mjs|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # =========================================================
  # 5) SPA fallback
  # =========================================================
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-store";
  }

  # =========================================================
  # 6) Health opcional
  # =========================================================
  location = /health {
    return 200 "OK";
    add_header Content-Type text/plain;
  }
}
