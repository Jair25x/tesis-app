# auth-profile-service-prod.yml (Configuración específica para el perfil 'prod')

spring:
  config:
    activate:
      on-profile: prod
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:/config-repo/auth-service/db/migration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://auth-prod-db:5432/tesisdb_auth}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
    
  boot:
  admin:
    client:
      url: ${ADMIN_MONITORING_URL} # URL del Admin Monitoring en producción
      instance:
        metadata:
          user:
            name: ${ADMIN_USER:admin} # Usuario desde variable de entorno (con default)
            password: ${ADMIN_PASSWORD:admin} # Contraseña desde variable de entorno (con default)
jwt:
  secret-key: ${JWT_SECRET}
  expirationMs: ${JWT_EXPIRATION_MS:3600000}
  refreshExpirationMs: ${JWT_REFRESH_EXPIRATION_MS:86400000}


eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL} # URL de Eureka en producción (desde variable de entorno)

management:
  endpoints:
    web:
      exposure:
        include: health,info # Exponer solo endpoints esenciales en producción

logging:
  level:
    root: INFO # Nivel de logging más bajo para producción
    com.tesis: INFO # Ajusta el paquete raíz de tu aplicación